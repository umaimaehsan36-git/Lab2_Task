<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ventic — Dashboard</title>
<link rel="stylesheet" href="dashborad.css">
</head>
<body>

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-icon">V</span>
            <span>Ventic</span>
        </div>

        <div class="nav-item active">▤ Dashboard ▾</div>
        <div class="nav-sub active-sub">Dashboard Light</div>
        <div class="nav-sub">Dashboard Dark</div>

        <div class="nav-item">▥ Orders list</div>
        <div class="nav-item">☆ Event</div>
        <div class="nav-item">☺ Customers</div>
        <div class="nav-item">▲ Analytics</div>
        <div class="nav-item">★ Reviews</div>

        <div class="nav-item">◫ Apps</div>
        <div class="nav-item">▦ Charts</div>
        <div class="nav-item">◆ Bootstrap</div>
        <div class="nav-item">✚ Plugins</div>
        <div class="nav-item">▣ Widget</div>
        <div class="nav-item">▭ Forms</div>
        <div class="nav-item">▤ Table</div>
    </aside>

    <!-- ── MAIN ── -->
    <div class="main">

        <!-- TOP NAV -->
        <div class="topnav">
            <div class="topnav-left">
                <span class="hamburger">☰</span>
                <input class="search-bar" type="text" placeholder="Search here...">
            </div>
            <div class="topnav-right">
                <span class="notif-icon">🔔<span class="badge-dot">12</span></span>
                <span class="notif-icon">💬<span class="badge-dot">5</span></span>
                <span class="notif-icon">🎁<span class="badge-dot pink">2</span></span>
                <span class="lang">ENGLISH ▾</span>
                <div class="user-info">
                    <img class="user-avatar" alt="James P. Sullivan"
                         src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23555b6e'/><text x='50' y='60' font-size='34' fill='white' text-anchor='middle' font-family='Arial'>JS</text></svg>">
                    <div>
                        <div><strong>Yasir Saddique</strong></div>
                        <p>Super Admin</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <div class="page-header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Lorem ipsum dolor sit amet</p>
                </div>
            </div>

            <!-- STAT CARDS (now full-photo cards) -->
            <div class="stat-cards">

                <div class="stat-card photo-card" style="background-image:url('https://picsum.photos/seed/ticket-card/400/420');"></div>

                <div class="stat-card photo-card" style="background-image:url('https://picsum.photos/seed/revenue-card/400/420');"></div>

                <div class="stat-card photo-card" style="background-image:url('https://picsum.photos/seed/sales-card/400/420');"></div>

                <div class="stat-card photo-card event-card" style="background-image:url('https://picsum.photos/seed/event-card/400/420');"></div>

            </div>

            <!-- BOTTOM ROW (now full-photo cards) -->
            <div class="bottom-row">

                <!-- BEST SELLING -->
                <div class="best-selling photo-card" style="background-image:url('https://picsum.photos/seed/best-selling-card/700/420');"></div>

                <!-- TICKET SOLD TODAY -->
                <div class="ticket-today photo-card" style="background-image:url('https://picsum.photos/seed/ticket-today-card/500/420');"></div>

            </div>

        </div>
    </div>

</body>
</html>
