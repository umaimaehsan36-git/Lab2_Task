<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ventic — Dashboard</title>
<link rel="stylesheet" href="dashboard1.css">
</head>
<body>

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-icon">UE</span>
            <span>Ventic</span>
        </div>

        <div class="nav-item active">▤ Dashboard ▾</div>
        <div class="nav-sub active-sub">Dashboard Light</div>
        <div class="nav-sub">Dashboard Dark</div>

        <div class="nav-item">▥ Orders list</div>
        <div class="nav-item">☆ Event</div>
        <div class="nav-item">☺ Customers</div>
        <div class="nav-item">▲ Analytics</div>
        <div class="nav-item">★ Reviews</div>

        <div class="nav-item">◫ Apps</div>
        <div class="nav-item">▦ Charts</div>
        <div class="nav-item">◆ Bootstrap</div>
        <div class="nav-item">✚ Plugins</div>
        <div class="nav-item">▣ Widget</div>
        <div class="nav-item">▭ Forms</div>
        <div class="nav-item">▤ Table</div>

    <!-- ── MAIN ── -->
    <div class="main">

        <!-- TOP NAV -->
        <div class="topnav">
            <div class="topnav-left">
                <span class="hamburger">☰</span>
                <input class="search-bar" type="text" placeholder="Search here...">
            </div>
            <div class="topnav-right">
                <span class="notif-icon">🔔</span>
                <span class="notif-icon">💬</span>
                <span class="notif-icon">🎁</span>
                <span class="lang">ENGLISH ▾</span>
                <div class="user-info">
                    <img class="user-avatar" alt="Umaima Eshan"
                         src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%236c3fa0'/><text x='50' y='60' font-size='28' fill='white' text-anchor='middle' font-family='Arial'>UE</text></svg>">
                    <div>
                        <div><strong>Umaima Eshan</strong></div>
                        <p>Super Admin</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <div class="page-header">
                <div>
                    <h1>Dashboard</h1>
                    <p>Lorem ipsum dolor sit amet</p>
                </div>
            </div>

            <!-- STAT CARDS -->
            <div class="stat-cards">
                <div class="stat-card photo-card" style="background-image:url('https://picsum.photos/seed/aurora-sky/400/420');"></div>
                <div class="stat-card photo-card" style="background-image:url('https://picsum.photos/seed/lavender-field/400/420');"></div>
                <div class="stat-card photo-card" style="background-image:url('https://picsum.photos/seed/cobalt-wave/400/420');"></div>
                <div class="stat-card photo-card event-card" style="background-image:url('https://picsum.photos/seed/misty-forest/400/420');"></div>
            </div>

            <!-- BOTTOM ROW -->
            <div class="bottom-row">
                <div class="best-selling photo-card" style="background-image:url('https://picsum.photos/seed/violet-canyon/700/420');"></div>
                <div class="ticket-today photo-card" style="background-image:url('https://picsum.photos/seed/indigo-coast/500/420');"></div>
            </div>

        </div>
    </div>
